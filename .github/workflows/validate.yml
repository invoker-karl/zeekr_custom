name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Run nightly to catch upstream HA / HACS rule drift even when we don't push.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  # NOTE: hassfest is intentionally not run.
  # The official home-assistant/actions/hassfest action requires the
  # standard `custom_components/<domain>/manifest.json` layout, but this
  # repo uses HACS root-layout (`content_in_root: true` in hacs.json).
  # HACS fully supports root-layout; hassfest does not.
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
